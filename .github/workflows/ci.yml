name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build

      - run: pnpm test

      - run: pnpm run test:e2e

      # Non-blocking until the typing work of phase 2 removes the remaining
      # no-unsafe-* errors (see plan); formatting is already clean.
      - name: Lint
        run: pnpm exec eslint "{src,test}/**/*.ts"
        continue-on-error: true

      - name: Formatting
        run: pnpm exec prettier --check "src/**/*.ts" "test/**/*.ts"
