name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build

      # ts-jest compiles in isolatedModules mode and skips type checking.
      - run: pnpm run typecheck

      - run: pnpm run lint:check

      - name: Formatting
        run: pnpm exec prettier --check "src/**/*.ts" "test/**/*.ts"

      - run: pnpm test

      - run: pnpm run test:e2e
